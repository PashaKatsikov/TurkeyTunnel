name: turkey_tunnel
description: Turkey Tunnel. Cross the lanes and cash out before the traffic does.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.2.1
  hooks: ^2.0.2
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/loading/
    - assets/road/
    - assets/actors/
    - assets/traffic/
    - assets/props/
