name: turkey_tunnel
description: Turkey Tunnel. Cross the lanes and cash out before the traffic does.
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  code_assets: ^1.2.1
  hooks: ^2.0.2
  shared_preferences: ^2.5.3
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.13.0

  # ── Off-ramp (gray) stack ──
  # Pins differ from any sibling but stay at/above the attribution
  # SDK floors in .cursor/rules/gray_part_pitfalls.md §19. Carets let
  # pub resolve up to the newest compatible point.
  connectivity_plus: ^7.0.0
  device_info_plus: ^11.3.0
  http: ^1.5.0
  crypto: ^3.0.6
  url_launcher: ^6.3.1
  flutter_secure_storage: ^10.0.0
  flutter_local_notifications: ^22.0.0
  appsflyer_sdk: ^6.17.0
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  firebase_app_check: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/loading/
    - assets/road/
    - assets/actors/
    - assets/traffic/
    - assets/props/
